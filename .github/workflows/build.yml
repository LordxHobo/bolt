# Builds Relay for Android (APK) and iOS (unsigned IPA for sideloading).
# Runs on every push to main, and on demand from the Actions tab.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org io.github.relayapp --project-name relay .
          fi
          dart run tool/configure_platforms.dart

      - run: flutter pub get

      - name: Analyze (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: relay-android
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org io.github.relayapp --project-name relay .
          fi
          dart run tool/configure_platforms.dart

      - run: flutter pub get

      - name: Build iOS app (no signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr relay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: relay-ios
          path: relay-unsigned.ipa
