# Builds Relay for Android (APK) and iOS (unsigned IPA for sideloading).
# Runs on every push to main, and on demand from the Actions tab.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          # Both platforms, even though each job only builds one: the icon
          # generator writes Android and iOS icons in one go.
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org io.github.relayapp --project-name relay .
          fi
          dart run tool/configure_platforms.dart

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # Newer Android build tools reject getDefaultProguardFile('proguard-android.txt'),
      # which some plugins (flutter_inappwebview_android 1.1.x) still use. Swap in
      # the optimize variant, the same fix the plugin made upstream.
      - name: Patch plugin ProGuard config
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -path '*/android/build.gradle*' -type f \
            -exec grep -l "proguard-android.txt" {} + 2>/dev/null | while read -r f; do
              echo "Patching $f"
              sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
            done

      - name: Analyze (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=RELAY_BUILD=${GITHUB_SHA::7}

      - uses: actions/upload-artifact@v5
        with:
          name: relay-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders
        run: |
          # Both platforms, even though each job only builds one: the icon
          # generator writes Android and iOS icons in one go.
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --platforms=android,ios --org io.github.relayapp --project-name relay .
          fi
          dart run tool/configure_platforms.dart

      - run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Fetch Amazon IVS Player SDK
        # The low-latency player. Amazon doesn't publish it on CocoaPods, so
        # it's downloaded here and bundled by packages/relay_native_player.
        run: |
          IVS_VERSION=1.56.0
          curl -sSfL "https://player.live-video.net/${IVS_VERSION}/AmazonIVSPlayer.xcframework.zip" -o "$RUNNER_TEMP/ivs.zip"
          rm -rf "$RUNNER_TEMP/ivs"
          unzip -q "$RUNNER_TEMP/ivs.zip" -d "$RUNNER_TEMP/ivs"
          FRAMEWORK=$(find "$RUNNER_TEMP/ivs" -type d -name 'AmazonIVSPlayer.xcframework' | head -n 1)
          test -n "$FRAMEWORK" || { echo "AmazonIVSPlayer.xcframework not found in the download"; exit 1; }
          mkdir -p packages/relay_native_player/ios/Frameworks
          rm -rf packages/relay_native_player/ios/Frameworks/AmazonIVSPlayer.xcframework
          cp -R "$FRAMEWORK" packages/relay_native_player/ios/Frameworks/
          ls packages/relay_native_player/ios/Frameworks/AmazonIVSPlayer.xcframework

      - name: Build iOS app (no signing)
        run: flutter build ios --release --no-codesign --dart-define=RELAY_BUILD=${GITHUB_SHA::7}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr relay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: relay-ios-${{ github.run_number }}
          path: relay-unsigned.ipa
