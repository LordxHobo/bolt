name: relay
description: Watch Twitch and Kick in one app, with 7TV emotes and TwitchAdSolutions ad blocking.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Twitch player (with the ad-block userscript injected at document start),
  # the Kick login page, and the Cloudflare-friendly Kick web requests.
  flutter_inappwebview: ^6.1.5
  # Native HLS playback for Kick streams.
  video_player: ^2.9.2

  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  # Pinned: 2.5.0 (released 2026-10-17) moved to a JNI bridge that fails at
  # startup with "NoSuchMethodError ... SharedPreferencesApiRegistrar.getAll".
  # Try removing this pin once a later 2.5.x fixes it.
  shared_preferences_android: 2.4.29
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/adblock/

# App icon. CI runs `dart run flutter_launcher_icons` after generating the
# android/ and ios/ folders, so replacing these PNGs is all it takes to change it.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
